<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">Software and infrastructure architecture graphic</title>
  <desc id="desc">Abstract diagram showing software, infrastructure, databases and documentation connected in a calm engineering layout.</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="1">
      <stop stop-color="#12313d"/>
      <stop offset="1" stop-color="#0d202b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".26"/>
    </filter>
  </defs>
  <rect width="760" height="520" rx="32" fill="#07141b"/>
  <circle cx="116" cy="80" r="180" fill="#1f7a8c" opacity=".18"/>
  <circle cx="690" cy="460" r="220" fill="#2a9d8f" opacity=".10"/>
  <g fill="none" stroke="#d7eef2" stroke-opacity=".2">
    <path d="M170 154h174v88h118v100h122"/>
    <path d="M240 356h146V234h178"/>
    <path d="M174 154v250h240"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="70" y="96" width="210" height="118" rx="24" fill="url(#panel)" stroke="#d7eef2" stroke-opacity=".22"/>
    <text x="96" y="140" fill="#f7fbfc" font-size="22" font-weight="700" font-family="Inter, Arial">Software</text>
    <text x="96" y="172" fill="#b8cbd3" font-size="15" font-family="Inter, Arial">C# · PHP · JavaScript · SQL</text>

    <rect x="430" y="82" width="250" height="132" rx="24" fill="url(#panel)" stroke="#d7eef2" stroke-opacity=".22"/>
    <text x="458" y="127" fill="#f7fbfc" font-size="22" font-weight="700" font-family="Inter, Arial">Infrastructure</text>
    <text x="458" y="159" fill="#b8cbd3" font-size="15" font-family="Inter, Arial">Linux · Git · Automation</text>

    <rect x="95" y="306" width="245" height="126" rx="24" fill="url(#panel)" stroke="#d7eef2" stroke-opacity=".22"/>
    <text x="124" y="353" fill="#f7fbfc" font-size="22" font-weight="700" font-family="Inter, Arial">Data</text>
    <text x="124" y="385" fill="#b8cbd3" font-size="15" font-family="Inter, Arial">MariaDB · SQLite · PostgreSQL</text>

    <rect x="430" y="292" width="250" height="140" rx="24" fill="url(#panel)" stroke="#d7eef2" stroke-opacity=".22"/>
    <text x="458" y="339" fill="#f7fbfc" font-size="22" font-weight="700" font-family="Inter, Arial">Documentation</text>
    <text x="458" y="371" fill="#b8cbd3" font-size="15" font-family="Inter, Arial">Requirements · Architecture · Ops</text>
  </g>
  <g fill="#d7eef2">
    <circle cx="344" cy="242" r="6"/>
    <circle cx="462" cy="242" r="6"/>
    <circle cx="386" cy="356" r="6"/>
    <circle cx="414" cy="404" r="6"/>
  </g>
</svg>
