<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" role="img" aria-labelledby="title desc">
  <title id="title">SASD delivery process</title>
  <desc id="desc">Five-step process: understand, scope, design, build, document.</desc>
  <rect width="820" height="260" rx="28" fill="#0d202b"/>
  <path d="M94 132h632" stroke="#d7eef2" stroke-opacity=".22" stroke-width="6" stroke-linecap="round"/>
  <g font-family="Inter, Arial">
    <g transform="translate(70 62)">
      <circle cx="45" cy="70" r="45" fill="#1f7a8c"/>
      <text x="45" y="78" text-anchor="middle" fill="#fff" font-size="28" font-weight="800">1</text>
      <text x="45" y="150" text-anchor="middle" fill="#f7fbfc" font-size="15" font-weight="700">Understand</text>
    </g>
    <g transform="translate(230 62)">
      <circle cx="45" cy="70" r="45" fill="#1f7a8c"/>
      <text x="45" y="78" text-anchor="middle" fill="#fff" font-size="28" font-weight="800">2</text>
      <text x="45" y="150" text-anchor="middle" fill="#f7fbfc" font-size="15" font-weight="700">Scope</text>
    </g>
    <g transform="translate(390 62)">
      <circle cx="45" cy="70" r="45" fill="#1f7a8c"/>
      <text x="45" y="78" text-anchor="middle" fill="#fff" font-size="28" font-weight="800">3</text>
      <text x="45" y="150" text-anchor="middle" fill="#f7fbfc" font-size="15" font-weight="700">Design</text>
    </g>
    <g transform="translate(550 62)">
      <circle cx="45" cy="70" r="45" fill="#1f7a8c"/>
      <text x="45" y="78" text-anchor="middle" fill="#fff" font-size="28" font-weight="800">4</text>
      <text x="45" y="150" text-anchor="middle" fill="#f7fbfc" font-size="15" font-weight="700">Build</text>
    </g>
    <g transform="translate(710 62)">
      <circle cx="45" cy="70" r="45" fill="#1f7a8c"/>
      <text x="45" y="78" text-anchor="middle" fill="#fff" font-size="28" font-weight="800">5</text>
      <text x="45" y="150" text-anchor="middle" fill="#f7fbfc" font-size="15" font-weight="700">Document</text>
    </g>
  </g>
</svg>
